# Render Blueprint — API. Dashboard'da "New > Blueprint" ile bu dosya seçilir.
# Web (Next.js) Vercel'de: Root Directory = apps/web, env NEXT_PUBLIC_API_URL = Render API adresi.
services:
  - type: web
    name: otohesap-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_RO
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DEFAULT_CHAT_ID
        sync: false
      - key: NOTIFY_DRY_RUN
        value: "false"
      - key: AGENT_CHECK_INTERVAL_MIN
        value: "10"
      - key: CORS_ORIGINS
        sync: false   # Vercel üretim alan adı, virgülle birden çok
      - key: LOG_LEVEL
        value: INFO
