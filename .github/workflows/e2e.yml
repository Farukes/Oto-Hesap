name: e2e

# Uçtan uca testler: gerçek FastAPI + gerçek Postgres + seed verisi üstünde Playwright.
# `ci.yml` (api ruff+pytest, web lint+build) ayrı çalışır; bu iş onun yerine geçmez.

on:
  workflow_dispatch:   # e2e paketi henüz yeşil değil; elle tetiklenir (bkz. apps/web/e2e/README.md)

jobs:
  e2e:
    name: e2e (web)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otohesap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otohesap
      DATABASE_URL_RO: postgresql://postgres:postgres@localhost:5432/otohesap
      LLM_PROVIDER: fake
      NOTIFY_DRY_RUN: "true"
      # Zamanlayıcı kapalı: taslakları yalnız testin kendisi ("Şimdi kontrol et") üretsin.
      AGENT_SCHEDULER_ENABLED: "false"
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: API bağımlılıkları
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: şema + sentetik veri
        run: |
          psql -h localhost -U postgres -d otohesap -v ON_ERROR_STOP=1 -f docs/schema.sql
          uv run --project apps/api python data/seed.py --reset

      - name: API'yi başlat
        working-directory: apps/api
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API hazır:"; curl -s http://127.0.0.1:8000/api/health; echo; exit 0
            fi
            sleep 1
          done
          echo "API 60 sn içinde ayağa kalkmadı"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: web bağımlılıkları
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: tarayıcı (chromium)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: playwright
        working-directory: apps/web
        run: bunx playwright test

      - name: API günlüğü (hata ayıklama)
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

      - name: rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
